[tool.poetry]
name = "audioldm-eval"
version = "0.1.0"
description = "Audio evaluation tools and metrics for AudioLDM models"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "audioldm_eval"}]

[tool.poetry.dependencies]
python = ">=3.8,<3.12"
numpy = "^1.23.0"
torch = "^2.0.0"
PyYAML = "^6.0.0"
pandas = "^2.0.0"
scipy = "^1.10.0"
tqdm = "^4.66.0"
SoundFile = "^0.10.0"
librosa = "^0.9.0"
matplotlib = "^3.7.0"
pydub = "^0.25.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=audioldm_eval",
    "--cov=clap",
    "--cov=ctm",
    "--cov=tango_edm",
    "--cov=tools",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: marks tests as unit tests (deselect with '-m \"not unit\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["audioldm_eval", "clap", "ctm", "tango_edm", "tools"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
    "*/venv/*",
    "*/env/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"